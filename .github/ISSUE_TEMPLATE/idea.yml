name: Idea
description: Add an idea
title: "Idea: "
labels: ["idea"]
body:
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: The idea
      description: Two or three sentences are enough.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Who would need it
    validations:
      required: false
  - type: textarea
    id: links
    attributes:
      label: Links
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: Tags
      description: A few words, comma-separated, for example local-first, groups, commons. Reuse tags others already use where they fit.
    validations:
      required: false
  - type: textarea
    id: connections
    attributes:
      label: Connections
      description: Free text. People, communities, projects, ideas. Nothing has to be complete.
    validations:
      required: false
