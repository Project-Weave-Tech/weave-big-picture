name: Project
description: Add a project
title: "Project: "
labels: ["project"]
body:
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is being built
      description: Two or three sentences are enough.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Who it is for
    validations:
      required: false
  - type: textarea
    id: links
    attributes:
      label: Links
    validations:
      required: false
  - type: textarea
    id: connections
    attributes:
      label: Connections
      description: Free text. People, communities, projects, ideas. Nothing has to be complete.
    validations:
      required: false
