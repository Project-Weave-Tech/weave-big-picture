<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weave Big Picture</title>
<meta name="description" content="Projects and people around Project Weave, and how they connect.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* Paper and earth: the ground is a map, the connections glow like water and light over it */
:root{--bg:#EFE6D2;--paper:#F6EFDF;--surface:rgba(250,245,233,.92);--ink:#2B2117;--muted:#6E604C;--line:#D6C7A6;--contour:#B9A57E;--soft:#E6DAC0;
--cyan:#1E9DAE;--gold:#C38A1E;--gold-ink:#7A5208;--glow-c:rgba(46,198,214,.55);--glow-g:rgba(226,169,59,.5);
--k-software:#14707D;--k-software-b:#D7ECEC;--k-community:#4F6B2A;--k-community-b:#E1E9CF;--k-idea:#9A5E0E;--k-idea-b:#F3E2BE;--k-person:#9E3F26;--k-person-b:#F2D9CC;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17140F;--paper:#1F1B15;--surface:rgba(34,29,22,.9);--ink:#F1E8D6;--muted:#B5A68B;--line:#3E3527;--contour:#4A3F2E;--soft:#2A241B;
--cyan:#5FD6E3;--gold:#E8B451;--gold-ink:#F0C779;--glow-c:rgba(95,214,227,.6);--glow-g:rgba(232,180,81,.5);
--k-software:#6FD0DB;--k-software-b:#173033;--k-community:#B5CE7E;--k-community-b:#252C17;--k-idea:#F0C26B;--k-idea-b:#352812;--k-person:#F0A487;--k-person-b:#3A2119;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140F;--paper:#1F1B15;--surface:rgba(34,29,22,.9);--ink:#F1E8D6;--muted:#B5A68B;--line:#3E3527;--contour:#4A3F2E;--soft:#2A241B;
--cyan:#5FD6E3;--gold:#E8B451;--gold-ink:#F0C779;--glow-c:rgba(95,214,227,.6);--glow-g:rgba(232,180,81,.5);
--k-software:#6FD0DB;--k-software-b:#173033;--k-community:#B5CE7E;--k-community-b:#252C17;--k-idea:#F0C26B;--k-idea-b:#352812;--k-person:#F0A487;--k-person-b:#3A2119;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.45;display:flex;flex-direction:column}
a{color:var(--k-software);text-decoration:none}a:hover{text-decoration:underline}
.serif{font-family:"Newsreader",Georgia,serif}
#topo{position:fixed;inset:0;z-index:0;pointer-events:none}
header,main{position:relative;z-index:1}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding:14px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 70%,transparent);backdrop-filter:blur(4px)}
header h1{margin:0;font-family:"Newsreader",Georgia,serif;font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.01em}
header .sub{margin:2px 0 0;color:var(--muted);font-size:13.5px}
header .grow{flex:1 1 360px;min-width:0}
.views{display:inline-flex;padding:3px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.views a{display:inline-flex;align-items:center;min-height:36px;padding:0 18px;border-radius:999px;color:var(--muted);font-weight:500;font-size:13.5px;text-decoration:none}
.views a[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(60,40,10,.15)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted);text-decoration:none}
.btn-icon{width:40px;padding:0;justify-content:center}
main{flex:1;min-height:0;display:flex}
.view{flex:1;min-height:0;min-width:0}
.view[hidden]{display:none}
/* Graph view: the whole remaining screen */
#v-graph{position:relative}
#graph{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#graph:active{cursor:grabbing}
.float{position:absolute;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(60,40,10,.12);backdrop-filter:blur(6px)}
.chips{top:18px;left:18px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;max-width:calc(100% - 460px)}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer}
.chip b{font-weight:600;font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"]{color:var(--muted);opacity:.55}
.chip:hover{border-color:var(--muted)}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.hint{bottom:18px;left:18px;padding:8px 14px;border-radius:999px;color:var(--muted);font-size:12px}
.side{top:18px;right:18px;max-height:calc(100% - 36px);width:380px;padding:20px 22px;overflow:auto}
.side[hidden]{display:none}
.side h2{margin:4px 0 6px;font-family:"Newsreader",Georgia,serif;font-size:28px;line-height:1.1;font-weight:700}
.side .kind{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.side .unconf{font-size:12.5px;color:var(--muted);font-style:italic;margin:4px 0 0}
.side p{margin:8px 0}
.side h3{margin:16px 0 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.side ul{margin:0;padding-left:18px}
.clear{float:right;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
.clear:hover{color:var(--ink);border-color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:10px}
.tagc{font-size:11.5px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:none;font-family:inherit;cursor:pointer}
.tagc:hover{border-color:var(--gold);color:var(--ink)}
.empty{color:var(--muted)}
.node{cursor:pointer}
.node text{font-size:12.5px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.node.tag text{fill:var(--gold-ink);font-size:15px;font-weight:500;letter-spacing:.01em}
.node.dim,.link.dim{opacity:.1}
.link{fill:none;stroke-linecap:round}
.link.tag{stroke:var(--gold);stroke-opacity:.55;stroke-width:1.6}
.link.person{stroke:var(--cyan);stroke-opacity:.9;stroke-width:2.4}
/* List view */
#v-list{overflow:auto}
.lwrap{max-width:1240px;margin:0 auto;padding:36px 28px 72px}
.lwrap h2{margin:0;font-family:"Newsreader",Georgia,serif;font-size:48px;line-height:1.05;font-weight:700;letter-spacing:-.01em}
.lwrap .lede{margin:10px 0 22px;color:var(--muted);font-size:17px;max-width:760px}
.lchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;background:var(--surface);text-align:left;font:inherit;color:inherit;cursor:pointer}
.card:hover{border-color:var(--muted);box-shadow:0 6px 20px rgba(60,40,10,.1)}
.card .top{display:flex;align-items:center;gap:9px}
.card strong{font-family:"Newsreader",Georgia,serif;font-size:21px;line-height:1.15;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .kindw{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
@media (max-width: 900px){header{padding:12px 16px}header h1{font-size:24px}.side{top:auto;left:12px;right:12px;bottom:12px;width:auto;max-height:46%}.chips{left:12px;top:12px;max-width:calc(100% - 24px)}.hint{display:none}.lwrap{padding:24px 16px 56px}.lwrap h2{font-size:36px}}
</style>
</head>
<body>
<svg id="topo" aria-hidden="true"></svg>
<header>
<div class="grow"><h1>Weave Big Picture</h1><p class="sub">Projects and people around Project Weave, and how they connect.</p></div>
<nav class="views" aria-label="Views"><a href="#graph" data-view="graph">Graph</a><a href="#list" data-view="list">List</a></nav>
<button class="btn btn-icon" id="theme" type="button" aria-label="Switch theme" title="Switch theme"></button>
<a class="btn btn-icon" href="https://github.com/Project-Weave-Tech/weave-big-picture" target="_blank" rel="noopener" aria-label="Repository on GitHub" title="Repository on GitHub"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg></a>
<a class="btn" href="https://github.com/Project-Weave-Tech/weave-big-picture/issues/new/choose" target="_blank" rel="noopener">Add a project or a person</a>
</header>

<main>
<section class="view" id="v-graph" aria-labelledby="h-graph">
<svg id="graph" role="img" aria-labelledby="h-graph"><title id="h-graph">Graph of projects, people and shared tags</title></svg>
<div class="float chips" id="filters" role="group" aria-label="Show"></div>
<aside class="float side" id="side" aria-live="polite" hidden></aside>
<div class="float hint"><span style="color:var(--gold)">●</span> gold threads: tags two entries share · <span style="color:var(--cyan)">●</span> blue: a person works on a project · drag, scroll to zoom, click for details</div>
</section>

<section class="view" id="v-list" aria-labelledby="h-all" hidden>
<div class="lwrap">
<h2 id="h-all">Everyone on the map</h2>
<p class="lede" id="allsub"></p>
<div class="lchips" id="lfilters" role="group" aria-label="Show"></div>
<div class="grid" id="grid"></div>
</div>
</section>
</main>

<script>
// Kinds and their colours; people are a kind of their own
const KINDS = [
  { id: 'software', label: 'Software', one: 'software' },
  { id: 'community', label: 'Communities', one: 'community' },
  { id: 'idea', label: 'Ideas', one: 'idea' },
  { id: 'person', label: 'People', one: 'person' },
];
const kindOf = (it) => (it.type === 'person' ? 'person' : it.kind);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Enough Markdown for summaries: paragraphs, links, bold
const md = (s) => esc(s).split(/\n{2,}/).map((p) => '<p>' + p.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, ' ') + '</p>').join('');
// A short name for the graph: the part before ' / ' or ' (' ; initials from its words
const shortName = (n) => String(n).split(' / ')[0].split(' (')[0];
const initials = (n) => shortName(n).split(/[^A-Za-z0-9]+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();

// The ground: contour lines like a survey map, drawn once per size
function paintTopo() {
  const s = document.getElementById('topo'); const w = innerWidth, h = innerHeight;
  s.setAttribute('viewBox', `0 0 ${w} ${h}`);
  let seed = 7; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const hills = [...Array(3)].map(() => ({ x: rnd() * w, y: rnd() * h, r: 140 + rnd() * 160, ph: rnd() * 6 }));
  let p = '';
  hills.forEach((c) => { for (let k = 1; k <= 4; k++) { const R = c.r * k * 0.55; let d = ''; for (let a = 0; a <= 64; a++) { const t = (a / 64) * Math.PI * 2; const rr = R * (1 + 0.13 * Math.sin(3 * t + c.ph + k * 0.4) + 0.07 * Math.sin(5 * t - c.ph)); d += (a ? 'L' : 'M') + (c.x + rr * Math.cos(t)).toFixed(1) + ',' + (c.y + rr * 0.78 * Math.sin(t)).toFixed(1); } p += `<path d="${d}Z"/>`; } });
  s.innerHTML = `<g fill="none" stroke="${css('--contour')}" stroke-width="0.7" opacity="0.16">${p}</g>`;
}

// Theme toggle, remembered per viewer
const root = document.documentElement;
const themeBtn = document.getElementById('theme');
const isDark = () => (root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
const paintThemeBtn = () => { themeBtn.innerHTML = isDark() ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>'; };
try { const t = localStorage.getItem('weave-theme'); if (t) root.dataset.theme = t; } catch (e) {}
themeBtn.onclick = () => { root.dataset.theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('weave-theme', root.dataset.theme); } catch (e) {} paintThemeBtn(); paintTopo(); if (window.redraw) window.redraw(); };
paintThemeBtn(); paintTopo();

fetch('./data.json').then((r) => r.json()).then(start).catch((e) => { document.getElementById('side').innerHTML = '<p class="empty">data.json could not be read. ' + esc(e.message) + '</p>'; });

function start(d) {
  const items = d.items || []; const edges = d.edges || [];
  const byId = Object.fromEntries(items.map((i) => [i.id, i]));
  const peopleOf = {}; const projectsOf = {};
  edges.forEach((e) => { (peopleOf[e.to] = peopleOf[e.to] || []).push(e.from); (projectsOf[e.from] = projectsOf[e.from] || []).push(e.to); });
  const tagCount = {}; items.forEach((i) => (i.tags || []).forEach((t) => { tagCount[t] = (tagCount[t] || 0) + 1; }));
  const state = { kinds: new Set(KINDS.map((k) => k.id)), tags: true, focus: null, tagFocus: null };
  const n = (k) => items.filter((i) => kindOf(i) === k).length;

  // Two views, in the address: #graph (default) and #list
  const views = { graph: document.getElementById('v-graph'), list: document.getElementById('v-list') };
  let drawn = false;
  const showView = () => {
    const v = location.hash.slice(1) === 'list' ? 'list' : 'graph';
    Object.entries(views).forEach(([k, el]) => { el.hidden = k !== v; });
    document.querySelectorAll('[data-view]').forEach((a) => (a.getAttribute('data-view') === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
    if (v === 'graph' && !drawn) { drawn = true; draw(); }
  };
  window.addEventListener('hashchange', showView);

  // The same filter in both views: kinds, and in the graph the shared tags
  const chipsHtml = (withTags) => KINDS.filter((k) => n(k.id) || k.id === 'person').map((k) => `<button class="chip" type="button" data-k="${k.id}" aria-pressed="${state.kinds.has(k.id)}"><span class="dot" style="background:var(--k-${k.id})"></span>${k.label} <b>${n(k.id)}</b></button>`).join('')
    + (withTags ? `<button class="chip" type="button" data-t="1" aria-pressed="${state.tags}"><span class="dot" style="background:var(--gold);width:8px;height:8px"></span>Shared tags</button>` : '');
  const paintFilters = () => {
    const f = document.getElementById('filters'); const lf = document.getElementById('lfilters');
    f.innerHTML = chipsHtml(true); lf.innerHTML = chipsHtml(false);
    [f, lf].forEach((el) => el.querySelectorAll('[data-k]').forEach((b) => (b.onclick = () => { const k = b.dataset.k; state.kinds.has(k) ? state.kinds.delete(k) : state.kinds.add(k); paintFilters(); paintGrid(); if (drawn) draw(); })));
    f.querySelector('[data-t]').onclick = () => { state.tags = !state.tags; paintFilters(); draw(); };
  };

  const side = document.getElementById('side');
  const clearBtn = '<button class="clear" type="button" data-clear="1" aria-label="Clear selection">Clear ×</button>';
  const paintSide = () => {
    const it = state.focus && byId[state.focus];
    if (state.tagFocus) {
      const list = items.filter((i) => (i.tags || []).includes(state.tagFocus));
      side.innerHTML = `${clearBtn}<span class="kind" style="color:var(--gold)">tag</span><h2>${esc(state.tagFocus)}</h2><p class="empty">${list.length} entries</p><ul>${list.map((i) => `<li><a href="#" data-go="${i.id}">${esc(i.name)}</a></li>`).join('')}</ul>`;
    } else if (!it) {
      side.hidden = true; side.innerHTML = ''; return;
    } else {
      const k = kindOf(it); const kd = KINDS.find((x) => x.id === k) || { one: k };
      const rel = it.type === 'person' ? (projectsOf[it.id] || []) : (peopleOf[it.id] || []);
      const secs = Object.entries(it.sections || {}).map(([h, t]) => `<h3>${esc(h)}</h3>${md(t)}`).join('');
      side.innerHTML = `${clearBtn}<span class="kind" style="color:var(--k-${k})">${esc(kd.one)}</span><h2>${esc(it.name)}</h2>${it.confirmed === false ? '<p class="unconf">Compiled from public sources; not yet confirmed by the project.</p>' : ''}${md(it.summary)}
        <h3>${it.type === 'person' ? 'Works on' : 'People'}</h3>${rel.length ? '<ul>' + rel.map((x) => `<li><a href="#" data-go="${x}">${esc((byId[x] || {}).name || x)}</a></li>`).join('') + '</ul>' : `<p class="empty">${it.type === 'person' ? 'No project listed yet.' : 'Nobody listed yet.'}</p>`}
        ${secs}${(it.links || []).length ? '<h3>Links</h3><ul>' + it.links.map((l) => `<li><a href="${esc(l)}" target="_blank" rel="noopener">${esc(l.replace(/^https?:\/\//, ''))}</a></li>`).join('') + '</ul>' : ''}
        <div class="tags">${(it.tags || []).map((t) => `<button class="tagc" type="button" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
    }
    side.hidden = false; side.scrollTop = 0;
    side.querySelectorAll('[data-go]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); select(a.dataset.go); }));
    const cb = side.querySelector('[data-clear]'); if (cb) cb.onclick = clear;
    side.querySelectorAll('[data-tag]').forEach((b) => (b.onclick = () => selectTag(b.dataset.tag)));
  };
  const clear = () => { if (!state.focus && !state.tagFocus) return; state.focus = null; state.tagFocus = null; paintSide(); highlight(); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') clear(); });
  const select = (id) => { state.focus = state.focus === id ? null : id; state.tagFocus = null; paintSide(); highlight(); };
  const selectTag = (t) => { state.tagFocus = state.tagFocus === t ? null : t; state.focus = null; if (!state.tags) { state.tags = true; paintFilters(); draw(); } paintSide(); highlight(); };

  // The list: every entry as a card; a card opens it in the graph
  const grid = document.getElementById('grid');
  const paintGrid = () => {
    const list = items.filter((i) => state.kinds.has(kindOf(i))).sort((a, b) => a.name.localeCompare(b.name));
    document.getElementById('allsub').textContent = `${list.length} of ${items.length} projects and people. Open one to see it on the map with everything it connects to.`;
    grid.innerHTML = list.map((i) => { const k = kindOf(i); const kd = KINDS.find((x) => x.id === k) || { one: k }; return `<button class="card" type="button" data-go="${i.id}"><span class="top"><span class="dot" style="background:var(--k-${k})"></span><span class="kindw" style="color:var(--k-${k})">${esc(kd.one)}</span></span><strong>${esc(i.name)}</strong><p>${esc(String(i.summary || '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1'))}</p><span class="tags">${(i.tags || []).slice(0, 5).map((t) => `<span class="tagc">${esc(t)}</span>`).join('')}</span></button>`; }).join('') || '<p class="empty">Nothing in this filter.</p>';
    grid.querySelectorAll('[data-go]').forEach((b) => (b.onclick = () => { state.focus = null; location.hash = 'graph'; select(b.dataset.go); }));
  };

  // The graph: entries and people as nodes, person -> project as cyan links, shared tags as gold threads
  const svg = d3.select('#graph'); let sim, nodeSel, linkSel;
  const defs = svg.append('defs');
  const glow = (id, sd) => { const f = defs.append('filter').attr('id', id).attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%'); f.append('feGaussianBlur').attr('stdDeviation', sd).attr('result', 'b'); const m = f.append('feMerge'); m.append('feMergeNode').attr('in', 'b'); m.append('feMergeNode').attr('in', 'SourceGraphic'); };
  glow('glow', 2.6); glow('halo', 6);
  const zoomG = svg.append('g');
  const zoom = d3.zoom().scaleExtent([0.3, 3]).on('zoom', (e) => zoomG.attr('transform', e.transform));
  svg.call(zoom);
  // A click on empty space clears the selection
  svg.on('click', (e) => { if (e.target === svg.node()) clear(); });
  // Fit everything into the space left of the details card
  const fit = () => { const b = zoomG.node().getBBox(); if (!b.width) return; const W = svg.node().clientWidth, H = svg.node().clientHeight; const sideW = W > 900 && !side.hidden ? 420 : 0;
    // Keep clear of the floating filters at the top and the legend at the bottom
    const top = 84, bottom = 64, left = 40, right = 40 + sideW; const w = W - left - right, h = H - top - bottom;
    const k = Math.min(1.6, w / b.width, h / b.height); svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(left + w / 2 - k * (b.x + b.width / 2), top + h / 2 - k * (b.y + b.height / 2)).scale(k)); };
  // A thread bends a little, like a stream across the ground
  const curve = (l) => { const x1 = l.source.x, y1 = l.source.y, x2 = l.target.x, y2 = l.target.y; const dx = x2 - x1, dy = y2 - y1; const bend = l.cls === 'tag' ? 0.12 : 0.06; return `M${x1},${y1} Q${(x1 + x2) / 2 - dy * bend},${(y1 + y2) / 2 + dx * bend} ${x2},${y2}`; };
  function draw() {
    const w = svg.node().clientWidth || 1000, h = svg.node().clientHeight || 700;
    const shown = items.filter((i) => state.kinds.has(kindOf(i)));
    const shownIds = new Set(shown.map((i) => i.id));
    const nodes = shown.map((i) => ({ id: i.id, it: i, k: kindOf(i) }));
    const links = edges.filter((e) => shownIds.has(e.from) && shownIds.has(e.to)).map((e) => ({ source: e.from, target: e.to, cls: 'person' }));
    if (state.tags) {
      const shared = Object.keys(tagCount).filter((t) => shown.filter((i) => (i.tags || []).includes(t)).length >= 2);
      shared.forEach((t) => nodes.push({ id: 'tag:' + t, tag: t, k: 'tag', n: shown.filter((i) => (i.tags || []).includes(t)).length }));
      shown.forEach((i) => (i.tags || []).forEach((t) => { if (shared.includes(t)) links.push({ source: i.id, target: 'tag:' + t, cls: 'tag' }); }));
    }
    zoomG.selectAll('*').remove();
    linkSel = zoomG.append('g').attr('filter', 'url(#glow)').selectAll('path').data(links).join('path').attr('class', (l) => 'link ' + l.cls);
    nodeSel = zoomG.append('g').selectAll('g').data(nodes).join('g').attr('class', (n) => 'node' + (n.k === 'tag' ? ' tag' : ''))
      .on('click', (e, n) => (n.k === 'tag' ? selectTag(n.tag) : select(n.id)))
      .call(d3.drag().on('start', (e, n) => { if (!e.active) sim.alphaTarget(0.3).restart(); n.fx = n.x; n.fy = n.y; }).on('drag', (e, n) => { n.fx = e.x; n.fy = e.y; }).on('end', (e, n) => { if (!e.active) sim.alphaTarget(0); n.fx = null; n.fy = null; }));
    nodeSel.each(function (n) {
      const g = d3.select(this);
      if (n.k === 'tag') { g.append('circle').attr('r', 5 + Math.sqrt(n.n) * 1.8).attr('fill', css('--gold')).attr('filter', 'url(#glow)'); g.append('text').attr('x', 11 + Math.sqrt(n.n) * 1.8).attr('y', 5).text(n.tag); return; }
      const r = n.k === 'person' ? 15 : 21;
      g.append('circle').attr('r', r + 7).attr('fill', css('--k-' + n.k)).attr('opacity', 0.16).attr('filter', 'url(#halo)');
      g.append('circle').attr('r', r).attr('fill', css('--k-' + n.k + '-b')).attr('stroke', css('--k-' + n.k)).attr('stroke-width', 2.2).attr('stroke-dasharray', n.it.confirmed === false ? '3.5 2.5' : null);
      g.append('text').attr('text-anchor', 'middle').attr('y', 4.5).attr('style', `font-size:${n.k === 'person' ? 11 : 12}px;font-weight:600;fill:${css('--k-' + n.k)};stroke:none`).text(initials(n.it.name));
      g.append('text').attr('x', r + 7).attr('y', 5).attr('style', 'font-family:Newsreader,Georgia,serif;font-size:16px;font-weight:600').text(shortName(n.it.name));
      g.append('title').text(n.it.name + (n.it.confirmed === false ? ' (not yet confirmed by the project)' : ''));
    });
    sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id((n) => n.id).distance((l) => (l.cls === 'person' ? 110 : 120)).strength((l) => (l.cls === 'person' ? 0.8 : 0.22)))
      .force('charge', d3.forceManyBody().strength((n) => (n.k === 'tag' ? -160 : -900)))
      .force('center', d3.forceCenter(w / 2, h / 2))
      .force('x', d3.forceX(w / 2).strength(0.03)).force('y', d3.forceY(h / 2).strength(0.05))
      .force('collide', d3.forceCollide((n) => (n.k === 'tag' ? 22 : 64)))
      .on('end', fit)
      .on('tick', () => { linkSel.attr('d', curve); nodeSel.attr('transform', (n) => `translate(${n.x},${n.y})`); });
    highlight();
  }
  // Dim everything not linked to the selected node or tag
  function highlight() {
    if (!nodeSel) return;
    const key = state.tagFocus ? 'tag:' + state.tagFocus : state.focus;
    if (!key) { nodeSel.classed('dim', false); linkSel.classed('dim', false); return; }
    const near = new Set([key]); linkSel.each((l) => { if (l.source.id === key) near.add(l.target.id); if (l.target.id === key) near.add(l.source.id); });
    nodeSel.classed('dim', (n) => !near.has(n.id)); linkSel.classed('dim', (l) => !(l.source.id === key || l.target.id === key));
  }
  window.redraw = () => { if (drawn) draw(); };
  paintFilters(); paintSide(); paintGrid(); showView();
  window.addEventListener('resize', () => { clearTimeout(window._rt); window._rt = setTimeout(() => { paintTopo(); if (drawn) draw(); }, 200); });
}
</script>
